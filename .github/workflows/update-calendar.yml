name: Update agenda et ludothèque

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate agenda.json, vacances.json et jeux.json
        run: npm run build

      - name: Préparer les fichiers publics
        shell: bash
        run: bash scripts/prepare-public.sh

      - name: Déployer l'agenda complet sur OVH
        if: ${{ env.OVH_FTP_SERVER != '' && env.OVH_FTP_USERNAME != '' && env.OVH_FTP_PASSWORD != '' }}
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.OVH_FTP_SERVER }}
          username: ${{ env.OVH_FTP_USERNAME }}
          password: ${{ env.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-public/
          server-dir: /www/agenda/
          log-level: standard

      - name: Commit fichiers générés
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Mise à jour automatique de agenda.json / vacances.json / jeux.json"
