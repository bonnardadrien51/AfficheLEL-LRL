name: Déployer agenda et administration sur OVH

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/deploy-ovh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Déployer /public vers /agenda sur OVH
        if: ${{ secrets.OVH_FTP_SERVER != '' && secrets.OVH_FTP_USERNAME != '' && secrets.OVH_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: /agenda/
          log-level: standard

  deploy-admin:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Déployer /admin-site vers /agenda-admin sur OVH
        if: ${{ secrets.OVH_FTP_SERVER != '' && secrets.OVH_FTP_USERNAME != '' && secrets.OVH_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./admin-site/
          server-dir: /agenda-admin/
          log-level: standard
          exclude: |
            **/auth/users.json
