name: Déployer agenda et administration sur OVH

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "evenement.html"
      - "evenement-style.css"
      - "evenement-script.js"
      - "prochain-jour.html"
      - "jour.html"
      - "jour.css"
      - "prochain-jour.js"
      - "jour.js"
      - "pagination.js"
      - "ce-mois.html"
      - "prochain-mois.html"
      - "mois.css"
      - "mois.js"
      - "evenements-lel.html"
      - "evenements-lrl.html"
      - "evenements-association.js"
      - "agenda-paysage-4.html"
      - "agenda-paysage-6.html"
      - "agenda-paysage.css"
      - "agenda-association.css"
      - "agenda-association.js"
      - "affiche.html"
      - "affiche-carre-evenement.html"
      - "affiche-carre-evenement.css"
      - "affiche-facebook-evenement.html"
      - "affiche-facebook-evenement.css"
      - "agenda-lel-affiche.html"
      - "agenda-lel-carre.html"
      - "agenda-lel-facebook.html"
      - "agenda-lel-paysage-4.html"
      - "agenda-lel-paysage-6.html"
      - "agenda-lrl-affiche.html"
      - "agenda-lrl-carre.html"
      - "agenda-lrl-facebook.html"
      - "agenda-lrl-paysage-4.html"
      - "agenda-lrl-paysage-6.html"
      - "agenda-association.js"
      - "img/**"
      - ".github/workflows/deploy-ovh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-agenda:
    runs-on: ubuntu-latest
    env:
      OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
      OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
      OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer les fichiers publics
        shell: bash
        run: |
          set -e
          rm -rf deploy-public
          mkdir -p deploy-public/img
          cp public/index.html deploy-public/index.html
          cp public/agenda.json deploy-public/agenda.json
          cp evenement.html evenement-style.css evenement-script.js deploy-public/
          cp prochain-jour.html jour.html jour.css prochain-jour.js jour.js pagination.js deploy-public/
          cp ce-mois.html prochain-mois.html mois.css mois.js deploy-public/
          cp evenements-lel.html evenements-lrl.html evenements-association.js deploy-public/
          cp agenda-paysage-4.html agenda-paysage-6.html agenda-paysage.css agenda-association.js agenda-association.css deploy-public/
          cp affiche.html affiche-carre-evenement.html affiche-carre-evenement.css affiche-facebook-evenement.html affiche-facebook-evenement.css deploy-public/
          cp agenda-lel-affiche.html agenda-lel-carre.html agenda-lel-facebook.html agenda-lel-paysage-4.html agenda-lel-paysage-6.html deploy-public/
          cp agenda-lrl-affiche.html agenda-lrl-carre.html agenda-lrl-facebook.html agenda-lrl-paysage-4.html agenda-lrl-paysage-6.html deploy-public/
          cp img/logo-etabli.svg img/logo-raffut.svg deploy-public/img/

      - name: Déployer l'agenda public vers /agenda sur OVH
        if: ${{ env.OVH_FTP_SERVER != '' && env.OVH_FTP_USERNAME != '' && env.OVH_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy-public/
          server-dir: /www/agenda/
          log-level: standard

  deploy-admin:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
      OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
      OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Déployer /admin-site vers /agenda-admin sur OVH
        if: ${{ env.OVH_FTP_SERVER != '' && env.OVH_FTP_USERNAME != '' && env.OVH_FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./admin-site/
          server-dir: /www/agenda-admin/
          log-level: standard
          exclude: |
            **/auth/users.json
