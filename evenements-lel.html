<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<title>L'Établi Ludique — Événements</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0a1330;color:#fff;font-family:"Baloo 2",sans-serif;min-height:100vh;padding:35px 24px} .page{max-width:1200px;margin:auto}.head{display:flex;align-items:center;gap:25px;margin-bottom:30px}.head img{width:auto;height:90px;object-fit:contain}.head h1{margin:0;font-size:42px;line-height:1}.head p{margin:8px 0 0;color:#bfc7dc;font-size:18px}.eventList{display:grid;gap:18px}.eventItem{display:grid;grid-template-columns:230px 1fr;gap:24px;background:#fff;color:#27304d;border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,.18)}.eventVisual{min-height:180px;border-radius:12px;overflow:hidden;background:#edf0f7;display:flex;align-items:center;justify-content:center}.eventImage{width:100%;height:100%;min-height:180px;object-fit:cover;display:block}.eventImageEmpty{font-size:55px}.eventDate{font-weight:800;text-transform:capitalize;color:#7e9eea;font-size:16px}.eventMain h2{margin:2px 0 0;font-size:28px;line-height:1.1}.eventSubtitle{font-size:19px;font-weight:700;color:#68718a;margin-top:4px}.eventMeta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:17px;font-weight:700}.eventInfo{margin-top:6px;font-weight:700;color:#53607d}.eventStatus{display:inline-block;margin-top:8px;background:#c0392b;color:#fff;padding:2px 10px;border-radius:999px;font-weight:800}.posterButtons{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.posterBtn{display:inline-block;text-decoration:none;background:#e9edf7;color:#27304d;border-radius:9px;padding:9px 14px;font-weight:800}.posterBtn.primary{background:#7e9eea;color:#081331}.empty,.loading,.error{text-align:center;padding:50px;color:#bfc7dc;font-size:20px}.back{display:inline-block;color:#fff;text-decoration:none;margin-bottom:20px;opacity:.8}.back:hover{opacity:1}@media(max-width:700px){body{padding:22px 14px}.head{align-items:flex-start}.head img{height:70px}.head h1{font-size:31px}.eventItem{grid-template-columns:1fr}.eventVisual,.eventImage{min-height:210px}.eventMain h2{font-size:24px}}
</style>
</head>
<body data-association="lel">
<div class="page">
<a class="back" href="index.html">← Retour</a>
<header class="head">
<img id="associationLogo" src="img/logo-etabli.svg" alt="L'Établi Ludique">
<div><h1 id="associationName">L'Établi Ludique</h1><p>Événements des 3 calendriers : <span id="calendarList"></span></p></div>
</header>
<div id="loading" class="loading">Chargement des événements…</div>
<div id="error" class="error" style="display:none">Impossible de charger les événements.</div>
<div id="empty" class="empty" style="display:none">Aucun événement à venir pour L'Établi Ludique.</div>
<main id="eventsList" class="eventList"></main>
</div>
<script src="evenements-association.js"></script>
</body>
</html>
