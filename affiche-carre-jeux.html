<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

    <title>Affiche carrée - Nouveaux jeux - Le Raffut Ludique</title>

    <link rel="stylesheet" href="affiche-carre-jeux.css">

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</head>

<body>

<div class="toolbar">

    <button id="refreshBtn">
        🔄 Actualiser
    </button>

    <button id="downloadBtn">
        📷 Télécharger l'affiche
    </button>

</div>


<div id="cover">

<header>

    <img
        src="img/logo-raffut.svg"
        class="logo"
        alt="Le Raffut Ludique">

    <div class="header-text">

        <h1>Nouveaux jeux</h1>

        <div id="currentMonth"></div>

    </div>

</header>


<main>

    <div id="jeuxGrid">
        <!-- jeux.js génère les cartes ici -->
    </div>

    <div id="noJeux">
        Aucun nouveau jeu à afficher<br>pour le moment.
    </div>

</main>


<footer>

    <div id="update">
        Dernière mise à jour
    </div>

    <div id="agendaLink">
        Retrouvez toute la ludothèque sur
        <a href="https://leraffutludique.fr" target="_blank" rel="noopener">leraffutludique.fr</a>
    </div>

    <div>
        www.leraffutludique.fr
    </div>

</footer>

</div>

<script src="jeux.js"></script>

</body>

</html>
