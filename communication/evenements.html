<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Événements — L'Établi Ludique</title><style>body{font-family:Arial,sans-serif;background:#0a1330;color:#fff;padding:24px;max-width:1000px;margin:auto}.box{background:#141c40;padding:20px;border-radius:14px;margin-bottom:20px}button{border:0;border-radius:8px;padding:10px 14px;margin:4px;background:#2e5cf0;color:white;font-weight:bold;cursor:pointer}.active{background:#e97126}.event{display:grid;grid-template-columns:32px 1fr;background:#0d1535;padding:12px;border-radius:9px;margin:7px 0}.event input{width:20px;height:20px}.title{font-weight:bold}.meta{color:#ffd48a;font-size:14px;margin-top:4px}.place{color:#bfc6df;font-size:13px}@media(max-width:600px){body{padding:12px}}</style></head><body><div class="box"><h1>📅 Événements à venir</h1><p>Liste chronologique avec sélection et copie brute.</p><div id="tabs"></div><div><button onclick="all(true)">☑️ Tout sélectionner</button><button onclick="all(false)">☐ Tout désélectionner</button><button onclick="copySel()">📋 Copier la sélection</button><button onclick="copyAll()">📋 Copier tout</button></div><p id="info"></p><div id="list">Chargement…</div></div><script>let A=[],mode='commun';const C=['Partenaire','Animation','Marché / Expo'],R=['Soirée au chapeau','Soirée adhérents'];function lel(e){return C.includes(e.calendar)}function lrl(e){return R.includes(e.calendar)}function ev(){let a=A.filter(e=>{let d=new Date(e.start);return !isNaN(d)&&d>=new Date()});if(mode==='lel')a=a.filter(lel);if(mode==='lrl')a=a.filter(lrl);return a.sort((a,b)=>new Date(a.start)-new Date(b.start))}function title(e){return e.campaign?.titre||e.title||'Événement'}function place(e){return e.campaign?.lieu||e.location||''}function date(e){return new Date(e.start).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function time(e){let s=new Date(e.start),f=e.end&&new Date(e.end),x=s.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});if(!f||isNaN(f))return x;return x+' à '+f.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}function raw(e){return title(e)+'\n📅 '+date(e)+'\n🕒 '+time(e)+(place(e)?'\n📍 '+place(e):'')}function render(){tabs.innerHTML=[['commun','📅 Commune'],['lel','🧰 LEL'],['lrl','🎲 LRL']].map(x=>`<button class="${mode===x[0]?'active':''}" onclick="mode='${x[0]}';render()">${x[1]}</button>`).join('');let a=ev();list.innerHTML=a.length?a.map((e,i)=>`<label class="event"><input type="checkbox" class="ck" data-i="${i}"><div><div class="title">${title(e)}</div><div class="meta">📅 ${date(e)} · 🕒 ${time(e)}</div><div class="place">${place(e)?'📍 '+place(e):''}</div></div></label>`).join(''):'Aucun événement à venir.'}function all(v){document.querySelectorAll('.ck').forEach(x=>x.checked=v)}function copyEvents(a){if(!a.length){info.textContent='⚠️ Aucun événement.';return}navigator.clipboard.writeText(a.map(raw).join('\n\n')).then(()=>info.textContent='✓ '+a.length+' événement(s) copié(s).')}function copySel(){let a=ev();copyEvents([...document.querySelectorAll('.ck:checked')].map(x=>a[+x.dataset.i]).filter(Boolean))}function copyAll(){copyEvents(ev())}fetch('../agenda.json?t='+Date.now()).then(r=>r.json()).then(j=>{A=j.events||[];render()}).catch(()=>list.textContent='Erreur de chargement de agenda.json');</script></body></html>
