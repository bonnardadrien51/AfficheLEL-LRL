<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communications génériques — L'Établi Ludique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0a1330;color:#fff;font-family:"Baloo 2","Segoe UI",Arial,sans-serif;padding:24px}#page{max-width:1100px;margin:auto}header{display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}header img{height:70px;width:auto}h1{font-size:30px}header p{color:#a9b0cc}.toolbar{background:#141c40;border-radius:14px;padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.toolbar input,.toolbar select{padding:10px 13px;border:0;border-radius:8px;font:inherit;min-width:200px}.toolbar input{flex:1}.toolbar button{background:#e97126}.card{background:#141c40;border-radius:16px;padding:20px;margin-bottom:16px}.card.priority{border:2px solid #e97126}.cardHead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:14px}.category{display:inline-block;background:#e8bed4;color:#25142d;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;margin-bottom:6px}h2{font-size:22px}.status{font-size:12px;color:#a9b0cc;white-space:nowrap}.priorityText{display:inline-block;background:#e97126;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;margin-top:5px}textarea{width:100%;min-height:220px;resize:vertical;border:0;border-radius:10px;padding:14px;font:16px/1.45 Arial,sans-serif;color:#111;background:#fff;margin-bottom:10px}.hashtags{min-height:70px}.history{background:#0d1535;border-radius:10px;padding:12px 14px;margin:8px 0 14px}.historyTitle{font-weight:800;margin-bottom:7px}.history ul{padding-left:20px;color:#c6cbe0}.history li{margin:3px 0}.emptyHistory{color:#ffcf91}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 16px;font:700 15px "Baloo 2",sans-serif;cursor:pointer;background:#2e5cf0;color:#fff}button.secondary{background:#3a4066}button.success{background:#298f5b}button.danger{background:#a93f52}button:disabled{opacity:.5;cursor:wait}.message{margin-top:9px;font-size:13px;color:#a9b0cc}.message.error{color:#ff8080}.published{outline:2px solid #298f5b}.published .status{color:#6ee7a5}.empty{background:#141c40;padding:25px;border-radius:14px;color:#a9b0cc}.modalBack{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#141c40;border-radius:16px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin-bottom:15px}.form{display:grid;gap:10px}.form input,.form select{width:100%;padding:11px;border:0;border-radius:8px;font:inherit}.form textarea{min-height:180px}.modalActions{display:flex;gap:10px;justify-content:flex-end}.note{font-size:12px;color:#a9b0cc}@media(max-width:650px){body{padding:12px}header img{height:55px}h1{font-size:25px}.cardHead{flex-direction:column}.status{white-space:normal}}
</style></head>
<body><div id="page">
<header><img src="../img/logo-etabli.svg" alt="L'Établi Ludique"><div><h1>📣 Communications génériques</h1><p>Textes prêts à publier sur Facebook et Instagram, avec suivi de l'historique.</p></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="Rechercher une activité…"><select id="category"><option value="">Toutes les catégories</option></select><button id="add">➕ Nouveau post</button></div>
<div id="list">Chargement…</div></div>
<div class="modalBack" id="modal"><div class="modal"><h2>➕ Ajouter une publication</h2><div class="form"><input id="newTitle" placeholder="Titre du post"><input id="newCategory" placeholder="Catégorie (ex. Ateliers, Boutique…)" ><textarea id="newPost" placeholder="Texte de la publication"></textarea><textarea id="newTags" class="hashtags" placeholder="#hashtags"></textarea><div class="note">La nouvelle publication sera ajoutée à l'historique avec aucune date de publication tant que tu ne l'auras pas publiée.</div><div class="modalActions"><button class="secondary" id="cancel">Annuler</button><button class="success" id="create">Créer le post</button></div></div></div></div>
<script>
const PATH="communication-generiques.json",OWNER="bonnardadrien51",REPO="AfficheLEL-LRL";let posts=[],fileSha="";
const token=()=>localStorage.getItem("gh_token")||"";const b64utf8=s=>btoa(unescape(encodeURIComponent(s)));const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
async function load(){const r=await fetch(PATH+"?t="+Date.now());if(!r.ok)throw Error("Impossible de charger "+PATH);const d=await r.json();posts=(d.posts||[]).map(p=>({...p,historique:Array.isArray(p.historique)?p.historique:[],derniere_publication:p.derniere_publication||null}));try{const g=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`);if(g.ok)fileSha=(await g.json()).sha}catch(e){}fillCategories();render()}
function fillCategories(){const s=document.getElementById("category"),v=s.value;s.innerHTML='<option value="">Toutes les catégories</option>';[...new Set(posts.map(p=>p.categorie).filter(Boolean))].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;s.appendChild(o)});s.value=v}
function age(date){if(!date)return null;const d=new Date(date+"T12:00:00"),n=new Date(),months=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth(),days=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000);return {months,days}}
function priority(p){const a=age(p.derniere_publication);return !a||a.months>=6}
function ageText(p){const a=age(p.derniere_publication);if(!a)return "⚠️ Jamais publié";if(a.months>=12){const y=Math.floor(a.months/12);return `⚠️ Pas publié depuis ${y} an${y>1?"s":""}`};if(a.months>=6)return "⚠️ Pas publié depuis 6 mois ou plus";if(a.months>=2)return `Pas publié depuis ${a.months} mois`;if(a.days>=30)return "Pas publié depuis plus d'un mois";if(a.days===0)return "Publié aujourd'hui";return `Dernière publication il y a ${a.days} jour${a.days>1?"s":""}`}
function filtered(){const q=document.getElementById("search").value.toLowerCase().trim(),c=document.getElementById("category").value;return posts.filter(p=>(!q||[p.titre,p.categorie,p.post,p.hashtags].join(" ").toLowerCase().includes(q))&&(!c||p.categorie===c)).sort((a,b)=>{const pa=priority(a),pb=priority(b);if(pa!==pb)return pa?-1:1;return new Date(a.derniere_publication||"1900-01-01")-new Date(b.derniere_publication||"1900-01-01")})}
function render(){const list=document.getElementById("list"),items=filtered();list.innerHTML="";if(!items.length){list.innerHTML='<div class="empty">Aucune publication trouvée.</div>';return}items.forEach(p=>{const card=document.createElement("section");card.className="card"+(p.publie?" published":"")+(priority(p)?" priority":"");card.dataset.id=p.id;const hist=p.historique.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));card.innerHTML=`<div class="cardHead"><div><span class="category">${esc(p.categorie||"L'Établi Ludique")}</span><h2>${esc(p.titre)}</h2>${priority(p)?`<div class="priorityText">${ageText(p)}</div>`:""}</div><div class="status">${p.publie?"✓ Publié":"À publier"}<br>${p.derniere_publication?"Dernière : "+formatDate(p.derniere_publication):"Jamais publié"}</div></div><textarea class="postText">${esc(p.post||"")}</textarea><textarea class="hashtags" placeholder="#hashtags">${esc(p.hashtags||"")}</textarea><div class="history"><div class="historyTitle">📅 Historique des publications (${hist.length})</div>${hist.length?`<ul>${hist.map(h=>`<li>${formatDate(h.date)}${h.canal?" — "+esc(h.canal):""}</li>`).join("")}</ul>`:'<div class="emptyHistory">Aucune publication enregistrée</div>'}</div><div class="actions"><button class="copy">📋 Copier le post</button><button class="save">💾 Enregistrer</button><button class="publish success">➕ Ajouter une publication</button><button class="toggle secondary">${p.publie?"↩ Marquer non publié":"✓ Marquer publié"}</button></div><div class="message"></div>`;list.appendChild(card)});bind()}
function formatDate(s){return new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})}
function bind(){document.querySelectorAll(".card").forEach(card=>{const p=posts.find(x=>x.id===card.dataset.id);card.querySelector(".copy").onclick=async()=>{try{await navigator.clipboard.writeText(card.querySelector(".postText").value.trim()+"\n\n"+card.querySelector(".hashtags").value.trim());msg(card,"✓ Texte copié")}catch(e){msg(card,"Copie impossible",true)}};card.querySelector(".save").onclick=()=>{p.post=card.querySelector(".postText").value;p.hashtags=card.querySelector(".hashtags").value;saveData(card)};card.querySelector(".publish").onclick=()=>recordPublication(p,card);card.querySelector(".toggle").onclick=()=>{p.publie=!p.publie;saveData(card)}})}
async function recordPublication(p,card){const date=prompt("Date de publication (AAAA-MM-JJ)",new Date().toISOString().slice(0,10));if(!date||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return;const canal=prompt("Réseau(x) publié(s) — exemple : Facebook + Instagram","Facebook + Instagram")||"";p.historique=p.historique||[];p.historique.push({date,canal});p.historique.sort((a,b)=>new Date(a.date)-new Date(b.date));p.derniere_publication=p.historique[p.historique.length-1].date;p.publie=true;await saveData(card)}
function msg(card,t,e=false){const m=card.querySelector(".message");m.textContent=t;m.className="message"+(e?" error":"")}
async function saveData(card){const t=token();if(!t){if(card)msg(card,"Ajoute ton token GitHub dans Administration > Token GitHub.",true);return}try{if(!fileSha){const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"}});if(!r.ok)throw Error();fileSha=(await r.json()).sha}const body={message:"📣 Mise à jour des communications génériques",content:b64utf8(JSON.stringify({generated_at:new Date().toISOString().slice(0,10),posts},null,2)),sha:fileSha};const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:"PUT",headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw Error();fileSha=(await r.json()).content.sha;if(card){msg(card,"✓ Enregistré dans GitHub");setTimeout(render,500)}}catch(e){if(card)msg(card,"Échec de la sauvegarde GitHub",true)}}
document.getElementById("search").oninput=render;document.getElementById("category").onchange=render;document.getElementById("add").onclick=()=>{document.getElementById("modal").style.display="flex"};document.getElementById("cancel").onclick=()=>document.getElementById("modal").style.display="none";document.getElementById("create").onclick=()=>{const titre=document.getElementById("newTitle").value.trim(),categorie=document.getElementById("newCategory").value.trim()||"Autres",post=document.getElementById("newPost").value.trim(),hashtags=document.getElementById("newTags").value.trim();if(!titre||!post){alert("Le titre et le texte sont obligatoires.");return}const id=titre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now();posts.push({id,titre,categorie,publie:false,derniere_publication:null,historique:[],post,hashtags});document.getElementById("modal").style.display="none";document.getElementById("newTitle").value="";document.getElementById("newCategory").value="";document.getElementById("newPost").value="";document.getElementById("newTags").value="";fillCategories();render();saveData(null)};
load().catch(e=>document.getElementById("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>');
</script></body></html>
