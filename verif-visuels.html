<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

    <title>Suivi des visuels - Le Raffut Ludique</title>

    <style>

        *{ margin:0; padding:0; box-sizing:border-box; }

        body{
            background:#0d4c72;
            color:white;
            font-family:"Segoe UI",Arial,sans-serif;
            min-height:100vh;
            padding:40px 20px;
        }

        #wrapper{
            max-width:1100px;
            margin:auto;
        }

        a{ color:#9EB6F1; }

        h1{
            font-family:"Comic Neue",cursive;
            font-size:32px;
            font-weight:700;
            margin-bottom:6px;
        }

        #subtitle{
            color:rgba(255,255,255,.75);
            font-size:15px;
            margin-bottom:8px;
        }

        #updated{
            color:rgba(255,255,255,.55);
            font-size:13px;
            margin-bottom:30px;
        }

        .section{
            margin-bottom:40px;
        }

        .sectionHeader{
            display:flex;
            align-items:baseline;
            gap:12px;
            margin-bottom:14px;
            padding-bottom:8px;
            border-bottom:1px solid rgba(255,255,255,.15);
        }

        .sectionTitle{
            font-size:18px;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:.5px;
        }

        .sectionCount{
            font-size:14px;
            font-weight:700;
            padding:2px 10px;
            border-radius:999px;
            background:rgba(255,255,255,.15);
        }

        .searchBox{
            width:100%;
            padding:10px 14px;
            border-radius:10px;
            border:none;
            font-size:14px;
            margin-bottom:14px;
            background:rgba(255,255,255,.1);
            color:white;
        }

        .searchBox::placeholder{ color:rgba(255,255,255,.5); }

        table{
            width:100%;
            border-collapse:collapse;
            background:rgba(255,255,255,.06);
            border-radius:12px;
            overflow:hidden;
        }

        th, td{
            text-align:left;
            padding:10px 14px;
            font-size:14px;
        }

        th{
            background:rgba(255,255,255,.1);
            font-weight:700;
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:.4px;
        }

        tbody tr:nth-child(odd){
            background:rgba(255,255,255,.04);
        }

        td.thumb{
            width:56px;
        }

        td.thumb img{
            width:44px;
            height:44px;
            object-fit:cover;
            border-radius:8px;
            display:block;
            background:rgba(255,255,255,.1);
        }

        .empty{
            padding:30px;
            text-align:center;
            color:rgba(255,255,255,.6);
            font-size:14px;
            background:rgba(255,255,255,.06);
            border-radius:12px;
        }

        .backLink{
            display:inline-block;
            margin-top:10px;
            font-size:14px;
        }

    </style>

</head>

<body>

<div id="wrapper">

    <h1>Suivi des visuels de la ludothèque</h1>
    <div id="subtitle">Visuels manquants et jeux pas encore convertis en WebP</div>
    <div id="updated">Chargement...</div>

    <div class="section">
        <div class="sectionHeader">
            <div class="sectionTitle">Visuels manquants</div>
            <div class="sectionCount" id="countManquants">-</div>
        </div>
        <input type="text" class="searchBox" id="searchManquants" placeholder="Filtrer par titre...">
        <div id="tableManquants"></div>
    </div>

    <div class="section">
        <div class="sectionHeader">
            <div class="sectionTitle">Encore en .png</div>
            <div class="sectionCount" id="countPng">-</div>
        </div>
        <input type="text" class="searchBox" id="searchPng" placeholder="Filtrer par titre...">
        <div id="tablePng"></div>
    </div>

    <a class="backLink" href="index.html">&larr; Retour aux outils</a>

</div>

<script src="verif-visuels.js"></script>

</body>

</html>
