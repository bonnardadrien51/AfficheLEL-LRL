<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Générateur d'événement</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            font-family: "Comic Neue", sans-serif;
            margin: 0;
            padding: 20px;
        }

        .generator-container {
            max-width: 1200px;
            margin: auto;
        }

        .generator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel {
            padding: 20px;
            border-radius: 15px;
            background: #f5f5f5;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            box-sizing: border-box;
            font-family: monospace;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 4px;
        }

        .inscription-presets {
            margin-top: 8px;
        }

        .preset-title {
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        #preview {
            min-height: 300px;
            padding: 20px;
            border-radius: 15px;
            background: white;
        }

        #preview img {
            max-width: 100%;
            max-height: 250px;
            display: block;
            margin: 15px auto;
        }

        #qrcode {
            margin-top: 20px;
        }

        #qrCodeText {
            margin-top: 10px;
            word-break: break-all;
        }

        #qrCodeText a {
            color: inherit;
        }

        .actions {
            margin-top: 20px;
        }

        @media (max-width: 800px) {

            .generator-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="generator-container">

    <h1>Générateur d'événement</h1>

    <div class="generator-grid">

        <section class="panel">

            <h2>Informations</h2>

            <form id="generatorForm"></form>

            <div class="field">

                <label for="logoPicker">
                    Importer un logo
                </label>

                <input
                    type="file"
                    id="logoPicker"
                    accept="image/*"
                >

            </div>

            <div class="field">

                <label for="logoColor">
                    Couleur du fond du logo
                </label>

                <input
                    type="color"
                    id="logoColor"
                    value="#ffffff"
                >

            </div>

            <div class="actions">

                <button
                    type="button"
                    id="copyButton"
                >
                    Copier le JSON
                </button>

                <button
                    type="button"
                    id="resetButton"
                >
                    Réinitialiser
                </button>

            </div>

        </section>


        <section class="panel">

            <h2>Aperçu</h2>

            <div id="preview"></div>

            <h2>QR Code inscription</h2>

            <div id="qrcode"></div>

            <div id="qrCodeText"></div>

        </section>

    </div>


    <section class="panel" style="margin-top:30px">

        <h2>JSON généré</h2>

        <textarea
            id="output"
            readonly
        ></textarea>

    </section>

</div>


<script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
></script>

<script src="generateur.js"></script>

</body>

</html>
